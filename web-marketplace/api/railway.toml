[build]
# Build order: frontend first (Vite), then API (tsc).
# Assumes Railway Root Directory is set to WEB-Marketplace/api.
# cd ../frontend navigates to WEB-Marketplace/frontend, then back to api.
buildCommand = "cd ../frontend && npm ci && npm run build && cd ../api && npm ci && npm run build"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required environment variables (set in Railway dashboard):
#   DATABASE_URL          — PostgreSQL connection string
#   JWT_SECRET            — must match WEB-HMI and WEB-FwServer
#   NODE_ENV              — set to "production"
#   PORT                  — Railway sets this automatically
#   STRIPE_SECRET_KEY     — Stripe live secret key
#   STRIPE_PUBLIC_KEY     — Stripe live public key
#   STRIPE_WEBHOOK_SECRET — Stripe webhook signing secret
#   SENDGRID_API_KEY      — SendGrid API key for transactional email
#   SENDGRID_FROM_EMAIL   — Verified sender address
#   ALLOWED_ORIGINS       — https://pipedreamsystems.com
