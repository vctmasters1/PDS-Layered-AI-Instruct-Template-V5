[build]
# Railway builds this as a Docker image using the Dockerfile in this directory.
# No separate build command needed — Docker handles everything.
buildCommand = ""

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required environment variables (set in Railway dashboard after enabling Private Networking):
#   HMI_HOST  — private hostname of hmi-service       (e.g. hmi-service.railway.internal)
#   HMI_PORT  — private port of hmi-service           (found in Railway Networking tab)
#   MKT_HOST  — private hostname of marketplace-service (e.g. marketplace-service.railway.internal)
#   MKT_PORT  — private port of marketplace-service   (found in Railway Networking tab)
