<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;">
<title>PDS Role Editor</title>
<style>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
        color: var(--vscode-foreground);
        background: var(--vscode-editor-background);
        height: 100vh; overflow: hidden;
        display: flex;
    }

    /* ── LEFT SIDEBAR — Pin Map & Variables ── */
    .left-sidebar {
        width: 280px; min-width: 180px; max-width: 50vw;
        background: var(--vscode-sideBar-background);
        border-right: 1px solid var(--vscode-panel-border);
        display: flex; flex-direction: column;
        overflow: hidden; position: relative;
    }

    /* Resize handle */
    .resize-handle {
        position: absolute; top: 0; right: -3px;
        width: 6px; height: 100%; cursor: col-resize; z-index: 10;
    }
    .resize-handle:hover, .resize-handle.active {
        background: var(--vscode-focusBorder);
    }
    .left-sidebar .section-header {
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.5px; color: var(--vscode-sideBarSectionHeader-foreground);
        padding: 8px 12px 4px; border-bottom: 1px solid var(--vscode-panel-border);
        background: var(--vscode-sideBarSectionHeader-background);
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; user-select: none;
    }
    .left-sidebar .section-header:hover { opacity: 0.85; }
    .section-header .chevron { transition: transform 0.15s; }
    .section-header.collapsed .chevron { transform: rotate(-90deg); }

    /* Pin Map Table */
    .pin-map-wrapper {
        height: 55%; flex-shrink: 0; overflow-y: auto; min-height: 40px;
    }
    .pin-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .pin-table th {
        text-align: left; font-weight: 600; color: var(--vscode-descriptionForeground);
        padding: 3px 6px; border-bottom: 1px solid var(--vscode-panel-border);
        position: sticky; top: 0; background: var(--vscode-sideBar-background); z-index: 1;
        cursor: pointer; user-select: none; white-space: nowrap;
    }
    .pin-table th:hover { color: var(--vscode-foreground); }
    .pin-table th .sort-arrow { font-size: 8px; margin-left: 2px; opacity: 0.5; }
    .pin-table th.sorted .sort-arrow { opacity: 1; color: var(--vscode-textLink-foreground); }
    .pin-table td {
        padding: 2px 6px; border-bottom: 1px solid var(--vscode-panel-border);
    }
    .pin-jpin { color: var(--vscode-descriptionForeground); font-size: 10px; white-space: nowrap; }
        vertical-align: middle;
    }
    .pin-table tr.assigned { background: rgba(88, 166, 255, 0.08); }
    .pin-table tr.reserved { opacity: 0.55; font-style: italic; }
    .pin-table tr.reserved .pin-name { color: var(--vscode-descriptionForeground); }
    .pin-table tr.conflict td { background: rgba(248, 81, 73, 0.15); }
    .pin-name { font-family: monospace; font-weight: 500; white-space: nowrap; font-size: 10px; }
    .pin-caps { display: flex; gap: 2px; flex-wrap: wrap; }
    .cap-badge {
        font-size: 8px; padding: 1px 4px; border-radius: 3px; font-weight: 600;
        line-height: 1.4;
    }
    .cap-GPIO  { background: #21262d; color: #8b949e; }
    .cap-ADC   { background: #1a2332; color: #58a6ff; }
    .cap-PWM   { background: #1a2a1a; color: #3fb950; }
    .cap-SPI   { background: #2a2a1a; color: #d29922; }
    .cap-I2C   { background: #2a1a2a; color: #a78bfa; }
    .cap-UART  { background: #2a1a1a; color: #f85149; }
    .pin-assigned {
        font-size: 10px; color: var(--vscode-textLink-foreground);
        max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pin-assigned[draggable="true"] {
        cursor: grab; border-radius: 3px; padding: 1px 4px;
        background: rgba(88, 166, 255, 0.12); transition: background 0.15s;
    }
    .pin-assigned[draggable="true"]:hover { background: rgba(88, 166, 255, 0.25); }
    .pin-assigned.dragging { opacity: 0.4; }
    .pin-table tr.drop-target td { background: rgba(63, 185, 80, 0.18); }
    .pin-table tr.drop-target-invalid td { background: rgba(248, 81, 73, 0.15); }

    /* Horizontal (vertical-resize) handle shared by both sidebars */
    .h-resize-handle {
        height: 5px; flex-shrink: 0; cursor: row-resize;
        background: var(--vscode-panel-border); position: relative;
        transition: background 0.12s;
    }
    .h-resize-handle:hover, .h-resize-handle.active { background: var(--vscode-focusBorder); }

    /* Variable Registry */
    .var-registry-wrapper {
        flex: 1; overflow-y: auto; min-height: 40px;
    }
    .var-group-title {
        font-size: 10px; font-weight: 600; padding: 4px 12px 2px;
        color: var(--vscode-descriptionForeground); text-transform: uppercase;
        letter-spacing: 0.4px; background: var(--vscode-sideBarSectionHeader-background);
        border-bottom: 1px solid var(--vscode-panel-border);
    }
    .var-row {
        display: flex; align-items: center; gap: 4px;
        padding: 2px 12px; font-size: 10px;
        border-bottom: 1px solid var(--vscode-panel-border);
    }
    .var-row:hover { background: var(--vscode-list-hoverBackground); }
    .var-row input[type="checkbox"] { margin: 0; flex-shrink: 0; }
    .var-name { font-family: monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .var-type { color: var(--vscode-descriptionForeground); font-size: 9px; flex-shrink: 0; }
    .var-remote-badge {
        font-size: 8px; padding: 0 4px; border-radius: 2px;
        background: #1a2a1a; color: #3fb950; flex-shrink: 0;
    }
    .var-const-badge {
        font-size: 8px; padding: 0 4px; border-radius: 2px;
        background: #21262d; color: #8b949e; flex-shrink: 0;
    }

    /* ── MAIN PANEL — Function Cards ── */
    .main-panel {
        flex: 1; overflow-y: auto; padding: 12px 20px;
        display: flex; flex-direction: column; gap: 12px;
    }

    /* Top bar: selectors + actions */
    .top-bar {
        display: flex; align-items: center; gap: 12px;
        padding: 8px 12px; border-radius: 6px;
        background: var(--vscode-sideBarSectionHeader-background);
        border: 1px solid var(--vscode-panel-border);
        flex-wrap: wrap;
    }
    .top-bar label {
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        color: var(--vscode-descriptionForeground); letter-spacing: 0.3px;
    }
    .top-bar select, .top-bar input[type="text"] {
        padding: 4px 8px; background: var(--vscode-input-background);
        color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border);
        border-radius: 3px; font-size: 12px;
    }
    .top-bar select:focus, .top-bar input:focus { outline: 1px solid var(--vscode-focusBorder); }
    .top-bar-group { display: flex; align-items: center; gap: 4px; }
    .top-bar .spacer { flex: 1; }
    .btn {
        padding: 5px 12px; border: none; border-radius: 3px;
        font-size: 11px; cursor: pointer; font-weight: 500;
    }
    .btn-primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
    .btn-primary:hover { background: var(--vscode-button-hoverBackground); }
    .btn-secondary { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
    .btn-secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }

    /* Function cards */
    .func-card {
        border: 1px solid var(--vscode-panel-border);
        border-radius: 6px; overflow: hidden;
    }
    .func-card.disabled { opacity: 0.5; }
    .func-card-header {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; cursor: pointer; user-select: none;
        background: var(--vscode-sideBarSectionHeader-background);
        border-bottom: 1px solid var(--vscode-panel-border);
    }
    .func-card-header:hover { opacity: 0.9; }
    .func-card-header input[type="checkbox"] { margin: 0; }
    .func-card-title { font-size: 13px; font-weight: 600; flex: 1; }
    .func-card-locked { font-size: 10px; color: var(--vscode-descriptionForeground); }
    .func-card-chevron { transition: transform 0.15s; font-size: 10px; }
    .func-card.collapsed .func-card-chevron { transform: rotate(-90deg); }
    .func-card.collapsed .func-card-body { display: none; }
    .func-card-body { padding: 10px 12px; }

    /* Instance rows inside a function card */
    .instance-group {
        margin-bottom: 10px; padding: 8px;
        border: 1px solid var(--vscode-panel-border);
        border-radius: 4px; background: var(--vscode-editor-background);
    }
    .instance-header {
        display: flex; align-items: center; gap: 6px;
        margin-bottom: 6px; font-size: 12px; font-weight: 600;
    }
    .instance-header .instance-label { flex: 1; }
    .instance-alias {
        flex: 1; background: transparent; border: 1px solid transparent;
        border-radius: 3px; color: var(--vscode-foreground); font-size: 12px;
        font-weight: 600; padding: 2px 4px; outline: none;
    }
    .instance-alias:hover { border-color: var(--vscode-input-border); }
    .instance-alias:focus { border-color: var(--vscode-focusBorder); background: var(--vscode-input-background); }
    .instance-alias::placeholder { color: var(--vscode-descriptionForeground); font-weight: 600; }
    .instance-remove {
        background: none; border: none; color: var(--vscode-descriptionForeground);
        cursor: pointer; font-size: 14px; padding: 0 4px;
    }
    .instance-remove:hover { color: #f85149; }
    .add-instance-btn {
        font-size: 11px; padding: 6px 10px; margin-top: 4px;
        background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8; cursor: pointer;
        border-radius: 3px; width: 100%; font-weight: 500;
    }
    .add-instance-btn:hover { background: rgba(56, 189, 248, 0.16); border-color: #38bdf8; }

    /* Sub-component groups (nested feature blocks like dosing pumps) */
    .subcomp-group {
        margin-top: 8px; border: 1px solid var(--vscode-panel-border);
        border-radius: 5px; overflow: hidden;
    }
    .subcomp-header {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 10px; cursor: pointer; user-select: none;
        background: var(--vscode-sideBarSectionHeader-background);
        border-bottom: 1px solid var(--vscode-panel-border);
        font-size: 11px; font-weight: 600;
    }
    .subcomp-header:hover { opacity: 0.85; }
    .subcomp-chevron { transition: transform 0.15s; font-size: 9px; }
    .subcomp-group.collapsed .subcomp-chevron { transform: rotate(-90deg); }
    .subcomp-group.collapsed .subcomp-body { display: none; }
    .subcomp-body { padding: 8px 10px; }
    .subcomp-label { flex: 1; }

    /* Per-header background tinting */
    .header-block { padding: 8px; border-radius: 4px; margin-bottom: 6px; }
    .header-block[data-hue="0"] { background: rgba(248, 113, 113, 0.05); border-left: 3px solid rgba(248, 113, 113, 0.4); }
    .header-block[data-hue="1"] { background: rgba(251, 191, 36, 0.05); border-left: 3px solid rgba(251, 191, 36, 0.4); }
    .header-block[data-hue="2"] { background: rgba(52, 211, 153, 0.05); border-left: 3px solid rgba(52, 211, 153, 0.4); }
    .header-block[data-hue="3"] { background: rgba(96, 165, 250, 0.05); border-left: 3px solid rgba(96, 165, 250, 0.4); }
    .header-block[data-hue="4"] { background: rgba(167, 139, 250, 0.05); border-left: 3px solid rgba(167, 139, 250, 0.4); }
    .header-block[data-hue="5"] { background: rgba(244, 114, 182, 0.05); border-left: 3px solid rgba(244, 114, 182, 0.4); }
    .header-block[data-hue="6"] { background: rgba(45, 212, 191, 0.05); border-left: 3px solid rgba(45, 212, 191, 0.4); }
    .header-block[data-hue="7"] { background: rgba(253, 186, 116, 0.05); border-left: 3px solid rgba(253, 186, 116, 0.4); }

    /* ADC scaling row */
    .adc-scaling { display: flex; gap: 6px; padding: 4px 0; flex-wrap: wrap; align-items: center; }
    .adc-scaling .scale-field { display: flex; align-items: center; gap: 3px; }
    .adc-scaling .scale-field label { font-size: 10px; color: var(--vscode-descriptionForeground); min-width: 50px; }
    .adc-scaling .scale-field input {
        width: 60px; padding: 2px 4px; font-size: 10px; font-family: monospace;
        background: var(--vscode-input-background); color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border); border-radius: 3px;
    }

    /* Pin slot rows inside an instance */
    .pin-slot {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 0; font-size: 11px;
    }
    .pin-slot-label { min-width: 80px; color: var(--vscode-descriptionForeground); }
    .pin-slot select {
        flex: 1; padding: 3px 6px;
        background: var(--vscode-input-background); color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border); border-radius: 3px;
        font-size: 11px; font-family: monospace;
    }
    .pin-slot select.conflict { border-color: #f85149; background: rgba(248,81,73,0.1); }
    .pin-slot .pin-func-label {
        font-size: 10px; color: var(--vscode-descriptionForeground); min-width: 50px;
    }

    /* Variable row inside instance */
    .instance-var {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 0; font-size: 11px;
    }
    .instance-var label { min-width: 120px; font-family: monospace; font-size: 11px; }
    .instance-var input[type="text"], .instance-var input[type="number"] {
        flex: 1; min-width: 60px; max-width: 200px; padding: 3px 6px;
        background: var(--vscode-input-background); color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border); border-radius: 3px;
        font-size: 11px;
    }
    .instance-var .var-type-badge {
        font-size: 9px; color: var(--vscode-descriptionForeground); min-width: 55px; text-align: right;
    }
    .instance-var input[type="checkbox"] { margin: 0; }

    /* Placeholder */
    .placeholder {
        color: var(--vscode-descriptionForeground); font-style: italic;
        padding: 40px; text-align: center;
        border: 1px dashed var(--vscode-panel-border);
        border-radius: 6px;
    }

    /* ── RIGHT SIDEBAR — pds_fb Palette + Prefabs ── */
    .right-sidebar {
        width: 220px; min-width: 320px; max-width: 40vw;
        background: var(--vscode-sideBar-background);
        border-left: 1px solid var(--vscode-panel-border);
        display: flex; flex-direction: column;
        overflow: hidden; position: relative;
    }
    .right-resize-handle {
        position: absolute; top: 0; left: -3px;
        width: 6px; height: 100%; cursor: col-resize; z-index: 10;
    }
    .right-resize-handle:hover, .right-resize-handle.active {
        background: var(--vscode-focusBorder);
    }
    .right-sidebar .section-header {
        font-size: 11px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.5px; color: var(--vscode-sideBarSectionHeader-foreground);
        padding: 8px 12px 4px; border-bottom: 1px solid var(--vscode-panel-border);
        background: var(--vscode-sideBarSectionHeader-background);
        display: flex; justify-content: space-between; align-items: center;
        cursor: pointer; user-select: none;
    }
    .right-sidebar .section-header:hover { opacity: 0.85; }

    /* pds_fb palette */
    .fb-palette-wrapper { height: 55%; flex-shrink: 0; overflow-y: auto; min-height: 40px; padding: 6px; }
    .fb-palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .fb-cat-section {
        font-size: 9px; font-weight: 700; text-transform: uppercase;
        color: var(--vscode-descriptionForeground); letter-spacing: 0.5px;
        padding: 5px 2px 2px; grid-column: 1 / -1;
    }
    .fb-block-tile {
        padding: 5px 7px; border-radius: 4px; cursor: pointer; user-select: none;
        border: 1px solid var(--vscode-panel-border);
        background: var(--vscode-editor-background);
        transition: border-color 0.12s, background 0.12s;
        display: flex; flex-direction: column; gap: 2px;
    }
    .fb-block-tile:hover { border-color: var(--vscode-focusBorder); background: var(--vscode-list-hoverBackground); }
    .fb-block-tile.no-target { opacity: 0.45; cursor: not-allowed; }
    .fb-tile-label { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fb-tile-ports { font-size: 9px; color: var(--vscode-descriptionForeground); }
    .fb-cat-input  .fb-tile-label { color: #58a6ff; }
    .fb-cat-output .fb-tile-label { color: #3fb950; }
    .fb-cat-logic  .fb-tile-label { color: #d29922; }
    .fb-cat-utility .fb-tile-label { color: #a78bfa; }

    /* Prefabs */
    .prefabs-wrapper { flex: 1; overflow-y: auto; min-height: 40px; padding: 6px; }
    .prefab-tile {
        padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; cursor: pointer;
        border: 1px solid var(--vscode-panel-border); background: var(--vscode-editor-background);
        transition: border-color 0.12s, background 0.12s;
    }
    .prefab-tile:hover { border-color: var(--vscode-focusBorder); background: var(--vscode-list-hoverBackground); }
    .prefab-tile-label { font-size: 11px; font-weight: 600; }
    .prefab-tile-desc { font-size: 10px; color: var(--vscode-descriptionForeground); margin-top: 2px; }
    .prefab-tile-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
    .prefab-chip {
        font-size: 9px; padding: 1px 5px; border-radius: 3px;
        background: var(--vscode-badge-background); color: var(--vscode-badge-foreground);
    }

    /* ── Pipeline cards (in main panel) ── */
    .pipelines-heading {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 6px; padding-left: 4px;
    }
    .pipelines-heading-label { font-size: 13px; font-weight: 600; color: var(--vscode-descriptionForeground); }
    .pipeline-card {
        border: 1px solid var(--vscode-panel-border); border-radius: 6px;
        overflow: hidden; margin-bottom: 8px;
        transition: border-color 0.12s;
    }
    .pipeline-card.selected-pipeline { border-color: rgba(88,166,255,0.5); }
    .pipeline-card.collapsed .pipeline-body { display: none; }
    .pipeline-card.pl-dragging { opacity: 0.35; }
    .pipeline-card.pl-drag-over { border-color: var(--vscode-focusBorder); background: rgba(88,166,255,0.04); }
    .pipeline-card-header {
        display: flex; align-items: center; gap: 5px;
        padding: 6px 10px;
        background: var(--vscode-sideBarSectionHeader-background);
        border-bottom: 1px solid var(--vscode-panel-border);
        user-select: none; cursor: pointer;
    }
    .pipeline-drag-handle {
        display: flex; align-items: center; gap: 3px;
        cursor: grab; color: var(--vscode-descriptionForeground);
        padding: 0 2px; flex-shrink: 0;
    }
    .pipeline-drag-handle:active { cursor: grabbing; }
    .pipeline-enable-label {
        display: flex; align-items: center; gap: 4px; flex-shrink: 0;
        font-size: 11px; color: var(--vscode-descriptionForeground);
        cursor: pointer; user-select: none; white-space: nowrap;
    }
    .pipeline-drag-handle-icon { font-size: 13px; line-height: 1; }
    .pipeline-drag-label {
        font-size: 9px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.3px; color: var(--vscode-descriptionForeground);
    }
    .pipeline-name-input {
        flex: 1; min-width: 80px; max-width: 260px;
        background: var(--vscode-input-background);
        border: 1px solid var(--vscode-input-border); border-radius: 3px;
        color: var(--vscode-foreground); font-size: 13px; font-weight: 600;
        padding: 2px 5px; outline: none; font-family: var(--vscode-font-family);
    }
    .pipeline-name-input:hover { border-color: var(--vscode-focusBorder); }
    .pipeline-name-input:focus { border-color: var(--vscode-focusBorder); box-shadow: 0 0 0 1px var(--vscode-focusBorder); }
    .pipeline-body { padding: 8px 10px; }
    .pipeline-blocks-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }

    /* Block row inside a pipeline */
    .block-row {
        display: flex; align-items: center; gap: 5px;
        padding: 3px 8px; border-radius: 4px; cursor: pointer;
        border: 1px solid var(--vscode-panel-border); background: var(--vscode-editor-background);
    }
    .block-row:hover { background: var(--vscode-list-hoverBackground); }
    .block-row.blk-expanded { border-color: var(--vscode-focusBorder); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .block-type-badge {
        font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700;
        flex-shrink: 0; width: 110px; text-align: center; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
        background: rgba(128,128,128,0.15);
    }
    .fb-cat-input  .block-type-badge, .block-type-badge.cat-input  { color: #58a6ff; }
    .fb-cat-output .block-type-badge, .block-type-badge.cat-output { color: #3fb950; }
    .fb-cat-logic  .block-type-badge, .block-type-badge.cat-logic  { color: #d29922; }
    .fb-cat-utility .block-type-badge, .block-type-badge.cat-utility { color: #a78bfa; }
    .block-alias-input {
        flex: 1; min-width: 80px; max-width: 220px; background: var(--vscode-input-background);
        border: 1px solid var(--vscode-input-border); border-radius: 3px;
        color: var(--vscode-foreground); font-size: 12px; font-weight: 500;
        outline: none; padding: 2px 5px; font-family: var(--vscode-font-family); cursor: text;
    }
    .block-alias-input:focus { border-color: var(--vscode-focusBorder); }
    .block-alias-input::placeholder { color: var(--vscode-descriptionForeground); }
    .block-settings-btn {
        background: rgba(56,189,248,0.10); border: 1px solid rgba(56,189,248,0.35); color: #38bdf8;

    // ── State ──
    let state = {
        target: '',
        board:  '',
        hwrev: '',
        roleId: '',
        roleName: '',
        modules: {},
        components: {},
        pinAssignments: {},
        variables: {},
        pipelines: [],   // ordered array of { name, enabled, collapsed, blocks[] }
    };

    let pipelineSeq = 0;
    let selectedPipelineIdx = -1;

    function escapeHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ──
    (function init() {
        // Populate board dropdown
        const selB = document.getElementById('sel-board');
        boards.forEach(b => {
            const o = document.createElement('option');
            o.value = b.boardId; o.textContent = (b.boardAlias || b.boardId);
            selB.appendChild(o);
        });

        // Wire cascade event listeners
        selB.addEventListener('change', onBoardChange);
        document.getElementById('sel-hwrev').addEventListener('change', onHwrevChange);
        document.getElementById('inp-new-hwrev').addEventListener('input', onNewHwrevInput);
        document.getElementById('sel-role').addEventListener('change', onRoleChange);

        // Wire top-bar buttons
        document.getElementById('btn-save').addEventListener('click', onSave);
        document.getElementById('btn-generate').addEventListener('click', () => onGenerate(false));
        document.getElementById('btn-dryrun').addEventListener('click', () => onGenerate(true));
        document.getElementById('btn-add-pipeline').addEventListener('click', addPipeline);

        // Wire right-sidebar section toggles
        document.getElementById('right-sidebar').querySelectorAll('.section-header[data-toggle]').forEach(h => {
            h.addEventListener('click', function() {
                toggleSection(this, this.dataset.toggle);
            });
        });

        // Wire pin map drag-and-drop via persistent event delegation
        initPinDragDrop();
    })();

    // ── Board → HwRev → Role Cascading ──
    // Board is the single cascade driver. MCU target is derived from board JSON (readonly label).
    function onBoardChange() {
        state.board = document.getElementById('sel-board').value;
        const bData = boards.find(b => b.boardId === state.board);
        state.target = bData ? (bData.mcuTarget || '') : '';

        const lbl = document.getElementById('lbl-target');
        if (lbl) lbl.textContent = state.target || '';

        const selH = document.getElementById('sel-hwrev');
        const selR = document.getElementById('sel-role');
        selH.innerHTML = '<option value="">—</option>';
        selR.innerHTML = '<option value="">—</option>';
        selR.disabled = true;
        document.getElementById('inp-new-hwrev').style.display = 'none';
        document.getElementById('inp-new-hwrev').value = '';
        state.hwrev = '';

        if (!state.board) {
            selH.disabled = true;
            renderPinMap(); renderModuleCards(); renderPipelineCards();
            return;
        }

        // Collect all hwrevs for this board: from board JSON + from saved roles
        const hwrevSet = new Set();
        if (bData && bData.hwrev) hwrevSet.add(bData.hwrev);
        savedRoles.filter(sr => sr.board === state.board && sr.hwrev).forEach(sr => hwrevSet.add(sr.hwrev));
        const hwrevs = [...hwrevSet].sort();

        // Always enable hwrev dropdown and always include + New HwRev... once a board is selected
        selH.disabled = false;
        hwrevs.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; selH.appendChild(o); });
        const newHO = document.createElement('option'); newHO.value = '__new__'; newHO.textContent = '+ New HwRev...';
        selH.appendChild(newHO);

        renderPinMap();
        renderModuleCards();
        renderPipelineCards();
    }

    function onNewHwrevInput() {
        const val = document.getElementById('inp-new-hwrev').value.trim();
        state.hwrev = val;
        const selR = document.getElementById('sel-role');
        selR.innerHTML = '<option value="">—</option>';
        if (val) {
            selR.disabled = false;
            const newO = document.createElement('option'); newO.value = '__new__'; newO.textContent = '+ New Role...';
            selR.appendChild(newO);
        } else {
            selR.disabled = true;
        }
    }

    function onHwrevChange() {
        const rawVal = document.getElementById('sel-hwrev').value;
        const inp = document.getElementById('inp-new-hwrev');
        if (rawVal === '__new__') {
            inp.style.display = '';
            inp.value = '';
            inp.focus();
            state.hwrev = '';
            const selR = document.getElementById('sel-role');
            selR.innerHTML = '<option value="">—</option>';
            selR.disabled = true;
            return;
        }
        inp.style.display = 'none';
        inp.value = '';
        state.hwrev = rawVal;
        const selR = document.getElementById('sel-role');
        selR.innerHTML = '<option value="">— select or new —</option>';
        if (!state.hwrev) { selR.disabled = true; return; }
        selR.disabled = false;

        // Roles from the HAL directory structure (if dirs exist for this target+hwrev)
        const tData = targets.find(t => t.id === state.target);
        const hData = tData && tData.hwrevs.find(h => h.id === state.hwrev);
        const dirRoles = new Set(hData ? (hData.roles || []) : []);
        if (hData && hData.roles.length > 0) {
            hData.roles.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; selR.appendChild(o); });
        }

        // Saved roles: filter by board + hwrev (reliable, not by target which may be stale)
        const matchingSaved = savedRoles
            .filter(sr => sr.board === state.board && sr.hwrev === state.hwrev && !dirRoles.has(sr.id));
        if (matchingSaved.length > 0) {
            const sep = document.createElement('option');
            sep.disabled = true; sep.textContent = '── saved roles ──';
            selR.appendChild(sep);
            matchingSaved.forEach(sr => {
                const o = document.createElement('option');
                o.value = sr.id; o.textContent = sr.id;
                selR.appendChild(o);
            });
        }

        const newO = document.createElement('option'); newO.value = '__new__'; newO.textContent = '+ New Role...';
        selR.appendChild(newO);
    }

    function onRoleChange() {
        const val = document.getElementById('sel-role').value;
        if (val === '__new__') { document.getElementById('inp-role-id').focus(); return; }
        if (val) {
            document.getElementById('inp-role-id').value = val;
            state.roleId = val;
            vscode.postMessage({ command: 'loadRole', roleId: val });
        }
    }

    // ── Pin Map Rendering ──
    // ── Pin Map Sort State ──
    let pinSortCol = 'gpio';
    let pinSortAsc = true;

    function sortPinMap(col) {
        if (pinSortCol === col) { pinSortAsc = !pinSortAsc; }
        else { pinSortCol = col; pinSortAsc = true; }
        // Update header classes
        ['gpio','jpin','caps','assigned'].forEach(c => {
            const th = document.getElementById('th-' + c);
            th.classList.toggle('sorted', c === col);
            th.querySelector('.sort-arrow').textContent = (c === col && !pinSortAsc) ? '▴' : '▾';
        });
        renderPinMap();
    }

    function renderPinMap() {
        const tbody = document.getElementById('pin-table-body');
        const capData = pinCaps[state.board];
        if (!capData) {
            tbody.innerHTML = '<tr><td colspan="4" style="padding:12px; color:var(--vscode-descriptionForeground); font-size:11px; text-align:center;">Select a board</td></tr>';
            return;
        }

        const usedGpios = {};
        Object.entries(state.pinAssignments).forEach(([id, a]) => { usedGpios[a.gpio] = id; });

        // Build sortable rows
        let rows = capData.pins.map(pin => {
            const assignedId = usedGpios[pin.gpio];
            const assignedLabel = pin.reserved ? '' : (assignedId ? state.pinAssignments[assignedId].label : '');
            return { pin, assignedId, assignedLabel, capsCount: pin.caps.length };
        });

        // Sort
        const dir = pinSortAsc ? 1 : -1;
        if (pinSortCol === 'gpio') {
            rows.sort((a, b) => dir * (a.pin.gpio - b.pin.gpio));
        } else if (pinSortCol === 'jpin') {
            rows.sort((a, b) => {
                const aJ = a.pin.jpin || '';
                const bJ = b.pin.jpin || '';
                return dir * aJ.localeCompare(bJ) || (a.pin.gpio - b.pin.gpio);
            });
        } else if (pinSortCol === 'caps') {
            rows.sort((a, b) => dir * (b.capsCount - a.capsCount) || (a.pin.gpio - b.pin.gpio));
        } else if (pinSortCol === 'assigned') {
            rows.sort((a, b) => {
                const aA = a.assignedLabel ? 1 : 0;
                const bA = b.assignedLabel ? 1 : 0;
                return dir * (bA - aA) || (a.pin.gpio - b.pin.gpio);
            });
        }

        tbody.innerHTML = '';
        rows.forEach(({ pin, assignedId, assignedLabel }) => {
            const tr = document.createElement('tr');
            if (pin.reserved) tr.className = 'reserved';
            else if (assignedId) tr.className = 'assigned';
            const gpioUsers = Object.entries(state.pinAssignments).filter(([_, a]) => a.gpio === pin.gpio);
            if (gpioUsers.length > 1) tr.className = 'conflict';

            // Build assigned cell — draggable if assigned
            let assignedHtml;
            if (pin.reserved) {
                assignedHtml = '<em>reserved</em>';
            } else if (assignedLabel && assignedId) {
                assignedHtml = '<span draggable="true" class="pin-assigned"' +
                    ' data-assign-id="' + assignedId + '"' +
                    ' data-gpio="' + pin.gpio + '"' +
                    ' title="Drag to reassign">' + assignedLabel + '</span>';
            } else {
                assignedHtml = '<span class="pin-assigned">—</span>';
            }

            // Drop target attrs for non-reserved rows
            const dropAttrs = pin.reserved ? '' :
                ' data-drop-gpio="' + pin.gpio + '"' +
                ' data-drop-caps="' + pin.caps.join(',') + '"';

            const pinLabel = pin.reserved ? pin.name : ('GPIO' + pin.gpio);
            tr.innerHTML =
                '<td class="pin-name">' + pinLabel + '</td>' +
                '<td class="pin-jpin">' + (pin.jpin || '—') + '</td>' +
                '<td><div class="pin-caps">' + pin.caps.map(c => '<span class="cap-badge cap-' + c + '">' + c + '</span>').join('') + '</div></td>' +
                '<td' + dropAttrs + '>' + assignedHtml + '</td>';
            tbody.appendChild(tr);
        });

        // Wire once — guard inside ensures it's a no-op on subsequent renders
        initPinDragDrop();
    }

    // ── Pin Map Drag-and-Drop — event delegation on persistent tbody ──────────
    // Listeners live on the tbody element itself so they survive innerHTML re-renders.
    let pinDragData = null;

    function initPinDragDrop() {
        const tbody = document.getElementById('pin-table-body');
        if (!tbody || tbody._pinDragReady) return;
        tbody._pinDragReady = true;

        // dragstart — fires on the draggable <span>, bubbles up to tbody
        tbody.addEventListener('dragstart', e => {
            const el = e.target.closest('[data-assign-id]');
            if (!el) return;

            const assignId = el.getAttribute('data-assign-id');
            const fromGpio = parseInt(el.getAttribute('data-gpio'), 10);
            if (!assignId) return;

            const assignment = state.pinAssignments[assignId];
            let requiredCap = 'GPIO';

            if (assignId.startsWith('pl_')) {
                const foM = assignId.match(/^pl_(d+)_bl_(d+)_fo_(d+)_(.+)$/);
                const blkM = !foM && assignId.match(/^pl_(d+)_bl_(d+)_(.+)$/);
                if (foM) {
                    const pi = parseInt(foM[1], 10), bi = parseInt(foM[2], 10);
                    const fi = parseInt(foM[3], 10), sName = foM[4];
                    const blk = state.pipelines[pi] && state.pipelines[pi].blocks[bi];
                    const fo = blk && blk.fan_outputs && blk.fan_outputs[fi];
                    const foDef = fo && fbBlocks.find(f => f.id === fo.blockType);
                    const sdef = foDef && foDef.settings.find(s => s.name === sName);
                    if (sdef && sdef.pin_cap) requiredCap = sdef.pin_cap;
                } else if (blkM) {
                    const pi = parseInt(blkM[1], 10), bi = parseInt(blkM[2], 10), sName = blkM[3];
                    const blk = state.pipelines[pi] && state.pipelines[pi].blocks[bi];
                    const fbDef = blk && fbBlocks.find(f => f.id === blk.blockType);
                    const sdef = fbDef && fbDef.settings.find(s => s.name === sName);
                    if (sdef && sdef.pin_cap) requiredCap = sdef.pin_cap;
                }
            } else if (assignment && assignment.component) {
                const compId = assignment.component;
                const comp = components[compId];
                if (comp) {
                    const suffix = assignId.slice(compId.length + 1);
                    const sepIdx = suffix.indexOf('_');
                    const pinId = sepIdx >= 0 ? suffix.slice(sepIdx + 1) : suffix;
                    const allPins = getAllCompPins(comp);
                    const pdef = allPins.find(p => p.pin_id === pinId);
                    if (pdef) requiredCap = pdef.func.toUpperCase();
                }
            }

            pinDragData = { assignId, fromGpio, requiredCap };
            el.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', assignId);
        });

        // dragend — fires on the original source element, bubbles to tbody
        tbody.addEventListener('dragend', e => {
            const el = e.target.closest('[data-assign-id]');
            if (el) el.classList.remove('dragging');
            pinDragData = null;
            tbody.querySelectorAll('.drop-target, .drop-target-invalid').forEach(r => {
                r.classList.remove('drop-target', 'drop-target-invalid');
            });
        });

        // dragover — must preventDefault to allow drop
        tbody.addEventListener('dragover', e => {
            if (!pinDragData) return;
            const tr = e.target.closest('tr');
            if (!tr) return;
            e.preventDefault();

            const dropCell = tr.querySelector('[data-drop-gpio]');
            if (!dropCell) { tr.classList.add('drop-target-invalid'); return; }

            const targetCaps = (dropCell.getAttribute('data-drop-caps') || '').split(',');
            if (targetCaps.includes(pinDragData.requiredCap) || targetCaps.includes('GPIO')) {
                tr.classList.remove('drop-target-invalid');
                tr.classList.add('drop-target');
                e.dataTransfer.dropEffect = 'move';
            } else {
                tr.classList.remove('drop-target');
                tr.classList.add('drop-target-invalid');
                e.dataTransfer.dropEffect = 'none';
            }
        });

        // dragleave — only clear highlight when leaving the <tr> entirely
        tbody.addEventListener('dragleave', e => {
            const tr = e.target.closest('tr');
            if (tr && !tr.contains(e.relatedTarget)) {
                tr.classList.remove('drop-target', 'drop-target-invalid');
            }
        });

        // drop
        tbody.addEventListener('drop', e => {
            e.preventDefault();
            const tr = e.target.closest('tr');
            if (!tr || !pinDragData) return;
            tr.classList.remove('drop-target', 'drop-target-invalid');

            const dropCell = tr.querySelector('[data-drop-gpio]');
            if (!dropCell) return;

            const targetGpio = parseInt(dropCell.getAttribute('data-drop-gpio'), 10);
            const targetCaps = (dropCell.getAttribute('data-drop-caps') || '').split(',');
            if (!targetCaps.includes(pinDragData.requiredCap) && !targetCaps.includes('GPIO')) return;

            const assignId = pinDragData.assignId;
            const assignment = state.pinAssignments[assignId];
            if (!assignment || targetGpio === assignment.gpio) return;

            if (assignId.startsWith('pl_')) {
                const foM = assignId.match(/^pl_(d+)_bl_(d+)_fo_(d+)_(.+)$/);
                const blkM = !foM && assignId.match(/^pl_(d+)_bl_(d+)_(.+)$/);
                if (foM) {
                    const pi = parseInt(foM[1], 10), bi = parseInt(foM[2], 10);
                    const fi = parseInt(foM[3], 10), sName = foM[4];
                    const pl = state.pipelines[pi];
                    if (!pl || !pl.blocks[bi]) return;
                    const fo = pl.blocks[bi].fan_outputs && pl.blocks[bi].fan_outputs[fi];
                    if (!fo) return;
                    fo.settings[sName] = targetGpio;
                    assignment.gpio = targetGpio;
                } else if (blkM) {
                    const pi = parseInt(blkM[1], 10), bi = parseInt(blkM[2], 10), sName = blkM[3];
                    const pl = state.pipelines[pi];
                    if (!pl || !pl.blocks[bi]) return;
                    pl.blocks[bi].settings[sName] = targetGpio;
                    assignment.gpio = targetGpio;
                } else { return; }
            } else {
                const compId = assignment.component;
                if (!compId) return;
                const suffix = assignId.slice(compId.length + 1);
                const sepIdx = suffix.indexOf('_');
                const instIdx = parseInt(sepIdx >= 0 ? suffix.slice(0, sepIdx) : suffix, 10);
                const pinId = sepIdx >= 0 ? suffix.slice(sepIdx + 1) : '';
                const cs = state.components[compId];
                if (cs && cs.instances[instIdx] && pinId) {
                    cs.instances[instIdx].pins[pinId] = targetGpio;
                    assignment.gpio = targetGpio;
                }
            }

            pinDragData = null;
            renderPinMap();
            renderPipelineCards();
        });
    }

    // ── Variable Registry Rendering (left sidebar) ──
    const userVisibleModules = ['pds_storage'];
    function renderVariableRegistry() {
        const wrapper = document.getElementById('var-registry-wrapper');
        const enabledMods = Object.entries(state.modules).filter(([name, m]) => m.enabled && userVisibleModules.includes(name));

        if (enabledMods.length === 0) {
            wrapper.innerHTML = '<div style="padding:12px; color:var(--vscode-descriptionForeground); font-size:11px; text-align:center;">Enable modules to see variables</div>';
            return;
        }

        let html = '';
        enabledMods.forEach(([modName, modState]) => {
            const vars = state.variables[modName] || [];
            if (vars.length === 0) return;

            html += '<div class="var-group-title">' + modName.replace('pds_', '') + '</div>';
            vars.forEach((v, vi) => {
                const badge = v.remote
                    ? '<span class="var-remote-badge">BLE/WiFi</span>'
                    : '<span class="var-const-badge">CONST</span>';
                html += '<div class="var-row">' +
                    '<input type="checkbox" ' + (v.remote ? 'checked' : '') +
                    ' onchange="toggleVarRemote(\'' + modName + '\',' + vi + ', this.checked)" title="Toggle remote access" />' +
                    '<span class="var-name" title="' + (v.description || v.name) + '">' + v.name + '</span>' +
                    '<span class="var-type">' + v.type + '</span>' +
                    badge + '</div>';
            });
        });
        wrapper.innerHTML = html || '<div style="padding:12px; color:var(--vscode-descriptionForeground); font-size:11px; text-align:center;">No variables</div>';
    }

    function toggleVarRemote(mod, idx, checked) {
        if (state.variables[mod] && state.variables[mod][idx]) {
            state.variables[mod][idx].remote = checked;
            renderVariableRegistry();
        }
    }

    // ── Module Cards Rendering (main panel) ──
    function renderModuleCards() {
        const container = document.getElementById('modules-container');
        if (!state.target) {
            container.innerHTML = '<div class="placeholder">Select a target to begin adding function modules.</div>';
            return;
        }

        // Modules that are implicitly included — only show pds_storage
        const visibleModules = ['pds_storage'];

        // Initialize module state from allModules if not already
        allModules.forEach(m => {
            if (!state.modules[m.name]) {
                state.modules[m.name] = {
                    enabled: m.locked || !visibleModules.includes(m.name),
                    locked: m.locked || !visibleModules.includes(m.name),
                    headers: {},
                };
                // Init default vars
                if (defaultVars[m.name]) {
                    state.variables[m.name] = JSON.parse(JSON.stringify(defaultVars[m.name]));
                }
            }
        });

        let html = '';
        allModules.filter(m => visibleModules.includes(m.name)).forEach(m => {
            const ms = state.modules[m.name];
            const isCollapsed = !ms.enabled && !ms.locked;
            const disabledClass = (!ms.enabled && !ms.locked) ? ' disabled' : '';
            const collapsedClass = isCollapsed ? ' collapsed' : '';

            html += '<div class="func-card' + disabledClass + collapsedClass + '" id="card-' + m.name + '">';

            // Header
            html += '<div class="func-card-header" onclick="toggleCard(\'' + m.name + '\')">';
            html += '<input type="checkbox" ' + (ms.enabled ? 'checked' : '') + (ms.locked ? ' disabled' : '') +
                ' onclick="event.stopPropagation(); toggleModule(\'' + m.name + '\', this.checked)" />';
            html += '<span class="func-card-title">' + m.name + '</span>';
            if (ms.locked) html += '<span class="func-card-locked">REQUIRED</span>';
            html += '<span class="func-card-chevron">▾</span>';
            html += '</div>';

            // Body
            html += '<div class="func-card-body">';

            if (ms.enabled && m.headers.length > 0) {
                m.headers.forEach((h, hi) => {
                    const hState = ms.headers[h] || [];
                    const hReqs = [];
                    const hasInstances = false;

                    // Header checkbox
                    html += '<div class="header-block" data-hue="' + (hi % 8) + '">';
                    html += '<label style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; cursor:pointer;">';
                    html += '<input type="checkbox" ' + (hState.length > 0 ? 'checked' : '') +
                        ' onchange="toggleHeader(\'' + m.name + '\', \'' + h + '\', this.checked)" />';
                    html += h;
                    html += '</label>';

                    // Instances for this header
                    if (hState.length > 0 && hasInstances) {
                        hState.forEach((inst, ii) => {
                            html += '<div class="instance-group">';
                            html += '<div class="instance-header">';
                            html += '<span class="instance-label">' + h.replace('.h','') + ' #' + (ii+1) + '</span>';
                            if (hState.length > 1) {
                                html += '<button class="instance-remove" onclick="removeInstance(\'' + m.name + '\', \'' + h + '\', ' + ii + ')" title="Remove instance">✕</button>';
                            }
                            html += '</div>';

                            // Pin slots for this instance
                            inst.pins.forEach((p, pi) => {
                                html += renderPinSlot(m.name, h, ii, pi, p);
                                // ADC scaling fields
                                if (p.scaling) {
                                    html += renderAdcScaling(m.name, h, ii, pi, p);
                                }
                            });

                            html += '</div>';  // instance-group
                        });

                        // Add instance button
                        html += '<button class="add-instance-btn" onclick="addInstance(\'' + m.name + '\', \'' + h + '\')">+ Add ' + h.replace('.h','') + ' instance</button>';
                    }

                    html += '</div>';
                });

                // Module-level variables
                const vars = state.variables[m.name] || [];
                if (vars.length > 0) {
                    html += '<div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--vscode-panel-border);">';
                    html += '<div style="font-size:11px; font-weight:600; color:var(--vscode-descriptionForeground); margin-bottom:4px;">Variables</div>';
                    vars.forEach((v, vi) => {
                        html += '<div class="instance-var">';
                        html += '<label>' + v.name + '</label>';
                        html += '<input type="' + (v.type.startsWith('string') ? 'text' : 'number') + '" value="' + v.default + '"' +
                            ' onchange="updateVarDefault(\'' + m.name + '\', ' + vi + ', this.value)" />';
                        html += '<span class="var-type-badge">' + v.type + '</span>';
                        html += '<input type="checkbox" ' + (v.remote ? 'checked' : '') +
                            ' onchange="toggleVarRemote(\'' + m.name + '\', ' + vi + ', this.checked)" title="Remote access" />';
                        html += '</div>';
                    });
                    html += '</div>';
                }
            } else if (ms.enabled) {
                html += '<div style="font-size:11px; color:var(--vscode-descriptionForeground);">No configurable headers</div>';
            }

            html += '</div>';  // func-card-body
            html += '</div>';  // func-card
        });

        container.innerHTML = html;
    }

    // ── Pipeline Cards Rendering ─────────────────────────────────────────────
    // Build a <select> of GPIO pins filtered by capability, for use in block settings.
    function renderPinSelectHtml(pi, bi, sdefName, pinCap, val, onchangeExpr) {
        const capData = pinCaps[state.board];
        const numVal = parseInt(val);
        const onChange = onchangeExpr || ('updateBlockSetting(' + pi + ',' + bi + ',\'' + sdefName + '\',parseInt(this.value))');
        // No board selected — fall back to a plain number input
        if (!capData) {
            return '<input type="number" value="' + numVal + '" style="min-width:60px;max-width:100px;"' +
                ' onchange="' + onChange + '" />';
        }
        const filtered = capData.pins.filter(p => !p.reserved && p.caps.includes(pinCap));
        let s = '<select class="pin-cap-select" onchange="' + onChange + '">';
        s += '<option value="-1"' + (numVal === -1 ? ' selected' : '') + '>— none —</option>';
        filtered.forEach(p => {
            const label = 'GPIO' + p.gpio +
                (p.jpin ? ' · ' + p.jpin : '') +
                (p.name ? ' · ' + p.name : '');
            s += '<option value="' + p.gpio + '"' + (numVal === p.gpio ? ' selected' : '') + '>' + label + '</option>';
        });
        s += '</select>';
        return s;
    }
