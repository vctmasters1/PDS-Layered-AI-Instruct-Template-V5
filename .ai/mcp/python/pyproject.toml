[project]
name = "pds-mcp"
version = "0.1.0"
description = "MCP server for the PDS Depth-Priority Hierarchical AI-INSTRUCT system"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
pds-mcp = "pds_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pds_mcp*"]
