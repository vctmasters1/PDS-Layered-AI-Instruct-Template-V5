# Custom Compliance Rules for this Project
#
# These rules extend the standard AI-INSTRUCT framework checks.
# Enable/disable rules to match your project's standards.
#
# To add new rules interactively:
#   python .ai/engine/add_custom_rule.py
#
# To run analyzer with custom rules:
#   pwsh .github/debug/import-project.ps1 -Phase analyze
#
# Rules are checked against the project structure and source files.
# Results are included in compliance reports.

rules:
  # Example: Enforce Python docstrings in src/ and api/
  # Uncomment and customize to enable
  python_docstrings:
    enabled: false
    pattern: "all_python_files_must_have_module_docstring"
    description: "Every Python file must start with a module docstring"
    severity: "warning"
    paths:
      - "src/"
      - "api/"
    exclude:
      - "tests/"
      - "*_test.py"

  # Example: Enforce API route organization
  # Routes must be in api/routes/ directory
  api_organization:
    enabled: false
    pattern: "api_routes_must_be_in_api_routes_dir"
    description: "All API route definitions must be in api/routes/ directory"
    severity: "error"

  # Example: Prevent hardcoded secrets
  # Scan for hardcoded API keys, passwords, tokens in code
  security_no_hardcoded_secrets:
    enabled: false
    pattern: "no_hardcoded_secrets_in_code"
    description: "Scan for hardcoded API keys, passwords, tokens in code"
    severity: "error"
    scan_extensions:
      - ".py"
      - ".js"
      - ".ts"
      - ".env"

  # Example: Enforce type hints (optional, can be strict or lenient)
  type_hints:
    enabled: false
    pattern: "python_functions_must_have_type_hints"
    description: "Python functions should include type hints"
    severity: "warning"
    paths:
      - "src/"

# How to use:
# 1. Uncomment any rule you want to enable: set enabled: true
# 2. Customize paths, severity, exclusions as needed
# 3. Run analyzer: pwsh .github/debug/import-project.ps1 -Phase analyze
# 4. Review violations for any custom rules
#
# For interactive rule builder:
#   python .ai/engine/add_custom_rule.py
