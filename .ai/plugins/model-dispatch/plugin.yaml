# Model-dispatch plugin manifest.
# Ships DISABLED. Enable by flipping `status:` to `experimental` after
# configuring tiers.yaml and (optionally) probing local LLM endpoints.

name: model-dispatch
version: 0.1.0
status: experimental
description: >
  Optional per-task model-tier routing with live dispatcher. Assigns tiers
  (e.g. local-fast / local-strong / cloud-frontier) to agents and prompts
  based on hardware, privacy, and cost. Routes work to loaded models without
  reload overhead. Supports per-GPU device isolation (e.g. exclude display-only
  cards from compute tiers).

requires:
  framework: ">=5.0"
  plugins: []
  tools:
    - lmstudio # OR ollama, vllm, llama.cpp, etc. Informational only.
  python:
    - pyyaml
    - requests

provides:
  capabilities:
    - model-routing
    - privacy-tiering
    - gpu-device-isolation
  frontmatter_fields:
    - model
  slash_commands:
    - ai-plugin-discover
    - ai-dispatch-test
    - ai-suggest-tiers
  validator_checks:
    - model-tier-resolves
    - gpu-devices-valid
  governed_tools: []

owner: <project-owner>
links:
  docs: README.md
  tier_table: tiers.example.yaml
