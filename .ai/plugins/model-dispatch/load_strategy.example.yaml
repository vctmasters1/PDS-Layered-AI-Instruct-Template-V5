# Model loading strategy for model-dispatch plugin
# This file defines which models SHOULD be loaded, from where, and GPU assignments
# Run: pwsh .github/debug/load_models.ps1 to orchestrate loading
# Verify: pwsh .github/debug/verify_loaded_models.ps1 to check state

# Status: TEMPLATE (fill in your desired model strategy below)
#   enabled: false means this model will NOT be loaded automatically
#   enabled: true means the loader will attempt to load it
# Source: where to get the model (lmstudio-cache, huggingface-url, local-path, etc.)

models:

  # ============================================================================
  # TIER: local-embed (small, single-GPU, embedding-only)
  # ============================================================================
  
  embedding-nomic:
    tier: local-embed
    model_id: nomic-ai/text-embedding-nomic-embed-text-v1.5
    provider: lmstudio
    enabled: true
    source: lmstudio-cache              # Already cached in LM Studio
    gpu_devices: [0]
    description: >
      Embedding model for retrieval. Small, fast, runs on single GPU.
      Used for .ai/knowledge/ indexing and codebase search.
    notes: |-
      Pre-loaded in LM Studio. No action needed.

  # ============================================================================
  # TIER: local-fast (small, sub-second latency for routing/cleanup)
  # ============================================================================
  
  qwen-27b-fast:
    tier: local-fast
    model_id: qwen/qwen3.6-27b
    provider: lmstudio
    enabled: true
    source: lmstudio-cache              # Already loaded
    gpu_devices: [0]
    description: >
      27B dense model for fast routing, file ops, cleanup decisions.
      Sub-second latency tier.
    notes: |-
      Currently loaded. Keep loaded for fast routing.

  # ============================================================================
  # TIER: local-strong (balanced workhorse, 15-25B class)
  # ============================================================================
  
  qwen-35b-moe:
    tier: local-strong
    model_id: qwen/qwen3.6-35b-a3b
    provider: lmstudio
    enabled: true
    source: lmstudio-cache
    gpu_devices: [0, 1]
    description: >
      35B MoE model for balanced agent work. Good throughput + reasoning.
      Primary tier for scaffolding, validation, naming, supervision.
    notes: |-
      Mixture-of-Experts model. Lower overhead than dense 35B.
      Distribute across GPUs 0-1 for better throughput.

  # ============================================================================
  # TIER: local-heavy (complex reasoning, 70B+ class or code-specialized)
  # ============================================================================
  
  qwen-coder-80b:
    tier: local-heavy
    model_id: qwen/qwen3-coder-next
    provider: lmstudio
    enabled: true
    source: lmstudio-cache
    gpu_devices: [0, 1, 3]
    description: >
      80B code-specialized model for complex code generation,
      multi-file refactors, long-context reasoning.
      Slower but highest capability.
    notes: |-
      Requires all 3 compute GPUs. Reserve for generator and
      complex scaffolding tasks. High latency but highest quality.

  # ============================================================================
  # TIER: local-vision (multimodal, if available)
  # ============================================================================
  
  # NOTE: No multimodal model currently loaded. Options:
  # - qwen/qwen-vl-plus (if available)
  # - llava-1.6-mistral-7b
  # - cogvlm2-chat (if compatible with LM Studio)
  # For now, local-vision falls back to local-strong (27B general model).
  
  # ============================================================================
  # OPTIONAL: Additional models (not loaded by default)
  # ============================================================================
  
  # Keep these commented until you explicitly enable them.
  # Uncomment to add to your loading strategy.
  
  # qwen-1-alt:
  #   tier: local-strong
  #   model_id: qwen-1
  #   provider: lmstudio
  #   enabled: false              # Disable: redundant with qwen-35b-moe
  #   gpu_devices: [1, 3]
  #   description: Alternative dense 18B model for comparison testing.

# ============================================================================
# LOADING STRATEGY
# ============================================================================
# 
# Current desired state (EDIT THIS):
#   - local-embed: nomic embedding (0.5 GB, GPU 0)
#   - local-fast: qwen 27B (4.5 GB, GPU 0)
#   - local-strong: qwen 35B MoE (20 GB, GPUs 0–1)
#   - local-heavy: qwen 80B coder (40 GB, GPUs 0–1–3)
#   - local-vision: (fallback to local-fast)
#   Total: ~65 GB loaded / 96 GB available (67.7% utilization)
#
# GPU allocation:
#   GPU 0: embedding, fast, strong, heavy (shared load)
#   GPU 1: strong, heavy (shared load)
#   GPU 2: display-only (excluded from compute)
#   GPU 3: heavy (largest model needs most GPUs)
#
# To customize:
#   1. Edit 'enabled:' flags (true = load, false = skip)
#   2. Edit 'gpu_devices:' arrays per model
#   3. Add new model blocks with full spec
#   4. Run: pwsh .github/debug/load_models.ps1
#   5. Verify: pwsh .github/debug/verify_loaded_models.ps1

# ============================================================================
# NOTES FOR ADOPTERS
# ============================================================================
#
# Why this strategy?
# - All compute GPUs (0, 1, 3) are utilized continuously.
# - GPU 2 (4060 Ti) stays free for display and system tasks.
# - Avoids reload overhead: models stay loaded until you manually change them.
# - Tier hierarchy ensures fallback when a specific tier's model isn't needed.
#
# When to modify:
# - Add new models if you obtain larger models (e.g., 70B+ dense or 13B-class fast).
# - Disable models if you need to free VRAM (e.g., for other applications).
# - Adjust gpu_devices if you want different GPU affinity.
#
# Never manually edit tiers.yaml directly. Edit this file, run load_models.ps1,
# then /ai-suggest-tiers will propose updated tier assignments.
