# Eval: naming gate must be consultable before artifact creation
id: naming-gate-001
description: The five naming registries and the consult-naming governed tool must exist so the naming gate is enforceable.
scope: .
input:
  prompt: "Add a new error code for invalid input."
expectations:
  - kind: governed-tools-consulted
    includes:
      - consult-naming
  - kind: file-pattern
    path: .ai/coding-prefixes.md
    expect: exists
  - kind: file-pattern
    path: .ai/api-conventions.md
    expect: exists
  - kind: file-pattern
    path: .ai/database-schema.md
    expect: exists
  - kind: file-pattern
    path: .ai/error-codes.md
    expect: exists
  - kind: file-pattern
    path: .ai/config-vars.md
    expect: exists
severity: high
tags: [naming, governance]
