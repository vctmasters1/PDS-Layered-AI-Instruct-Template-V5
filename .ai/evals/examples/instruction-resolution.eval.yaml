# Eval: scope-authority resolves to the deepest .ai/instruct.md
id: instruction-resolution-001
description: At the workspace root, the authoritative .ai/instruct.md is the root one and parent meta files appear as background only.
scope: .
input:
  prompt: "Where should I put a new global convention?"
expectations:
  - kind: scope-authority
    equals: .ai/instruct.md
  - kind: file-pattern
    path: .github/copilot-instructions.md
    expect: exists
severity: high
tags: [routing, depth-priority]
