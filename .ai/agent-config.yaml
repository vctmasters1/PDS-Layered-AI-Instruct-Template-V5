version: "4.2"
name: "PDS Layered Agentic Runtime"
description: "Hierarchical instructions + governed tools + self-evolving + foresight capabilities"

core:
  instruction_engine: "depth-priority"
  # governed_tools: .ai/agents/tools/*.json are governance checklists read by agents.
  # They are NOT MCP wire-protocol tool definitions. A real MCP server is not yet configured.
  # See .ai/mcp/tools/ to add project-specific tool checklists.
  governed_tools_enabled: true
  heartbeat_interval: "every 6 steps"
  heartbeat_procedure: ".ai/heartbeat.md"

safety:
  archive_first: true
  requires_approval: ["high", "medium"]
  log_all_changes: true

log_format:
  file_pattern: ".ai/logs/YYYY-MM-DD-session.md"
  entry_fields:
    - timestamp # ISO 8601
    - action # brief description of what was done
    - files_affected # list of relative paths ([] if none)
    - safety_level # low | medium | high
    - approval_obtained # true | false | n/a
    - outcome # success | skipped | failed

self_improvement:
  enabled: true
  reflection_frequency: "after every major task"
  approval_required: true
  procedure: ".ai/agents/tools/reflect-and-improve.json"

foresight:
  enabled: true
  gap_analysis: true
  risk_forecasting: true
  engine: ".ai/engine/foresight_engine.py"

observability:
  enabled: true
  metric_file_pattern: ".ai/logs/metrics-YYYY-MM-DD.jsonl"
  emit_on: ["invocation_end", "heartbeat", "approval_event", "handoff"]
  retain_days: 30
  thresholds:
    token_spike_multiplier: 5
    budget_exceedance_count: 3
    failure_streak: 3
    approval_fatigue_count: 20
    window_max_days: 7
  observer_agent: ".github/agents/pds-meta-observer.agent.md"
