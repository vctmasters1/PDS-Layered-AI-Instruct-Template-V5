<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Suite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      width: 280px;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-secondary { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-profile { background: #0d9488; color: #fff; }
    .divider { border-top: 1px solid #1e293b; margin: 10px 0; }
    #status {
      font-size: 12px;
      min-height: 36px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      display: none;
    }
    #status.info  { background: #1e293b; color: #94a3b8; display: block; }
    #status.error { background: #450a0a; color: #fca5a5; display: block; }
    #status.success { background: #052e16; color: #86efac; display: block; }
    #config-warning {
      background: #431407;
      color: #fdba74;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: none;
    }
    .settings-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .link-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }
    .link-btn:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Resume Suite</h1>

  <div id="config-warning">
    ⚠ Server not configured. Click Settings to add your server URL and API token.
  </div>

  <button class="btn btn-primary" id="btn-send">Send to Server</button>
  <button class="btn btn-secondary" id="btn-download">Download as .res.md</button>

  <div class="divider" id="profile-divider" style="display:none"></div>
  <button class="btn btn-profile" id="btn-profile" style="display:none">⬆ Import Indeed Profile</button>

  <div class="divider"></div>

  <div class="settings-row">
    <button class="link-btn" id="btn-settings">⚙ Settings</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
