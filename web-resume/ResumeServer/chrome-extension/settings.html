<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Suite — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input {
      display: block;
      width: 100%;
      padding: 9px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    .help { font-size: 12px; color: #64748b; margin-top: 4px; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
    }
    button:hover { background: #2563eb; }
    #msg {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
    }
    #msg.success { color: #86efac; }
    #msg.error { color: #fca5a5; }
    .token-section { margin-top: 32px; border-top: 1px solid #1e293b; padding-top: 24px; }
    .token-section p { font-size: 13px; color: #64748b; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Resume Suite Settings</h1>

  <form id="settings-form">
    <div class="field">
      <label for="server-url">Server URL</label>
      <input type="url" id="server-url" placeholder="http://192.168.1.100:38291" />
      <p class="help">The address of your local Resume Suite server.</p>
    </div>
    <div class="field">
      <label for="api-token">API Token</label>
      <input type="password" id="api-token" placeholder="Paste your token here" />
      <p class="help">In Resume Suite, click the <strong>⬇ Extension</strong> button — the setup modal has a <em>Copy My Token</em> button.</p>
    </div>
    <button type="submit">Save Settings</button>
    <div id="msg"></div>
  </form>

  <div class="token-section">
    <p>Don't have a token? Log in to <strong>Resume Suite</strong> in your browser, go to <em>Settings</em>, and copy your API token.</p>
  </div>

  <script src="settings.js"></script>
</body>
</html>
