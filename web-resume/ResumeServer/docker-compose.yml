services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: resumesuite
      POSTGRES_USER: resumesuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_set_in_env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumesuite"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    build: .
    restart: unless-stopped
    # Port 38291 exposed on HTTP for the Chrome extension — extensions cannot
    # connect to self-signed TLS, so they bypass Caddy and hit Express directly.
    ports:
      - "38291:38291"
    environment:
      PORT: "38291"
      NODE_ENV: production
      DATABASE_URL: "postgresql://resumesuite:${POSTGRES_PASSWORD:-changeme_set_in_env}@db:5432/resumesuite"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      LLM_API_URL: "${LLM_API_URL:-http://host.docker.internal:1234}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.6-27b}"
      LLM_TIMEOUT_MS: "${LLM_TIMEOUT_MS:-300000}"
      # Multi-GPU: run start-lms-instances.ps1, then set in .env:
      # LLM_MODEL_IDS: "qwen-0,qwen-1,qwen-2"
      LLM_MODEL_IDS: "${LLM_MODEL_IDS:-}"
      USERDATA_PATH: "/app/userdata"
      PYTHON_CMD: "python3"
      # Origins accepted by CORS — the browser sees the Caddy HTTPS URL, not Express directly
      ALLOWED_ORIGINS: "https://localhost:8443,https://24.101.223.202:8443,${ALLOWED_ORIGINS:-}"
    volumes:
      # Mount workspace UserData into the container
      - ../UserData:/app/userdata
    depends_on:
      db:
        condition: service_healthy
    # Allows the container to reach LLM Studio on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  caddy-data:    # Persists TLS certs across container restarts
  caddy-config:
