# Development-only: runs PostgreSQL in Docker so you can run the
# server and Vite dev server locally without containerizing Node.
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: resumesuite
      POSTGRES_USER: resumesuite
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
