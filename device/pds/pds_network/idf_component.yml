## Component manifest for pds_network
## Declares managed dependencies that are not bundled in ESP-IDF 5.x
dependencies:
  ## mdns was removed from the bundled ESP-IDF components tree in v5.x.
  ## Declaring it here ensures the component manager downloads it before
  ## cmake requirement resolution tries to link pds_network against it.
  espressif/mdns:
    version: ">=1.3.2"
