## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=5.0.0'

  ## mdns was removed from the bundled IDF components in ESP-IDF 5.x
  ## and is now a managed component from the Espressif registry.
  espressif/mdns:
    version: ">=1.3.2"

  ## led_strip was removed from bundled components in ESP-IDF 5.x.
  ## The Espressif component registry API is broken for this component, so we
  ## vendor it locally from idf-extra-components at Device/pds/led_strip/.
  ## The path is relative to this idf_component.yml file.
  espressif/led_strip:
    path: ../pds/led_strip
